name: eventsourcing

services:
    #######################################################
    #  PostgreSQL
    #######################################################
    postgres:
        profiles: [ postgres, postgres-all, all, all-no-ui, ci, sample ]
        image: postgres:18.7-alpine
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: pg_isready -U postgres -d postgres
            interval: 5s
            timeout: 10s
            retries: 100
        networks:
            - postgres

    pgadmin:
        profiles: [ postgres-ui, postgres-all, all ]
        image: dpage/pgadmin4:9.19
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pgadmin.org}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
            PGADMIN_CONFIG_SERVER_MODE: 'False'
        ports:
            - '${PGADMIN_PORT:-5050}:80'
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            - postgres
        networks:
            - postgres

    #######################################################
    #  KurrentDB
    #######################################################
    kurrentdb:
        profiles: [ kurrentdb, kurrentdb-all, all, all-no-ui, ci, sample ]
        image: ${KURRENTDB_IMAGE:-kurrentplatform/kurrentdb:26.2.3-experimental-arm64-10.0-noble}
        # on ARM (e.g. Apple Silicon) run: KURRENTDB_IMAGE=kurrentplatform/kurrentdb:26.2.3-experimental-arm64-10.0-noble docker compose --profile all up
        environment:
            - KURRENTDB_CLUSTER_SIZE=1
            - KURRENTDB_RUN_PROJECTIONS=All
            - KURRENTDB_START_STANDARD_PROJECTIONS=true
            - KURRENTDB_NODE_PORT=2113
            - KURRENTDB_INSECURE=true
            - KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true
        ports:
            - '${KURRENTDB_PORT:-2113}:2113'
        volumes:
            - kurrentdb-data:/var/lib/kurrentdb
            - kurrentdb-logs:/var/log/kurrentdb
        networks:
            - kurrentdb

networks:
    postgres:
        driver: bridge
    kurrentdb:
        driver: bridge

volumes:
    postgres-data:
    pgadmin-data:
    kurrentdb-data:
    kurrentdb-logs:
