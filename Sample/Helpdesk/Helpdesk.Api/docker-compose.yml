name: eventsourcing

services:
    nginx:
        profiles: [ sample ]
        restart: always
        image: nginx:1.31.8-alpine
        ports:
            - "${NGINX_PORT:-8089}:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - helpdesk-api

    helpdesk-api:
        profiles: [ sample ]
        build:
            dockerfile: Dockerfile
            context: .
            args:
                project_name: Helpdesk.Api
        deploy:
            replicas: 1
        depends_on:
            postgres:
                condition: service_healthy
        restart: always

    #######################################################
    #  PostgreSQL
    #######################################################
    postgres:
        profiles: [ postgres, postgres-all, all, all-no-ui, ci, sample ]
        image: postgres:18.7-alpine
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: pg_isready -U postgres -d postgres
            interval: 5s
            timeout: 10s
            retries: 100
        networks:
            - postgres

networks:
    postgres:
        driver: bridge

volumes:
    postgres-data:
