name: eventsourcing

services:
    #######################################################
    #  PostgreSQL
    #######################################################
    postgres:
        profiles: [ postgres, postgres-all, all, all-no-ui, ci, sample ]
        image: postgres:18.7-alpine
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: pg_isready -U postgres -d postgres
            interval: 5s
            timeout: 10s
            retries: 100
        networks:
            - postgres

    pgadmin:
        profiles: [ postgres-ui, postgres-all, all ]
        image: dpage/pgadmin4:9.19
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pgadmin.org}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
            PGADMIN_CONFIG_SERVER_MODE: 'False'
        ports:
            - '${PGADMIN_PORT:-5050}:80'
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            - postgres
        networks:
            - postgres

    #######################################################
    #  Kafka
    #######################################################
    kafka:
        profiles: [ kafka, kafka-all, all, all-no-ui, ci ]
        image: confluentinc/confluent-local:8.4.1
        hostname: kafka
        networks:
            - kafka
        ports:
            - "${KAFKA_PORT:-9092}:9092"
            - "9091:9091"
        healthcheck:
            test: kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1
            interval: 5s
            timeout: 10s
            retries: 100
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            ADVERTISED_HOST_NAME: kafka
            KAFKA_ADVERTISED_HOSTNAME: 127.0.0.1
            KAFKA_JMX_PORT: 9101
            KAFKA_JMX_HOSTNAME: localhost
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
            KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

    init-kafka:
        profiles: [ kafka, kafka-all, all, all-no-ui ]
        image: confluentinc/confluent-local:8.4.1
        hostname: init-kafka
        depends_on:
            - kafka
        entrypoint: [ '/bin/sh', '-c' ]
        networks:
            - kafka
        command: |
            "
            # blocks until kafka is reachable
            kafka-topics --bootstrap-server kafka:29092 --list

            echo -e 'Creating kafka topics'
            kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic Carts --replication-factor 1 --partitions 1
            kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic Orders --replication-factor 1 --partitions 1
            kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic Payments --replication-factor 1 --partitions 1
            kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic Shipments --replication-factor 1 --partitions 1

            echo -e 'Successfully created the following topics:'
            kafka-topics --bootstrap-server kafka:29092 --list
            "

    schema_registry:
        profiles: [ kafka-ui, kafka-all, all ]
        image: confluentinc/cp-schema-registry:8.4.1
        hostname: schema_registry
        ports:
            - 8181:8181
            - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
        depends_on:
            - kafka
        networks:
            - kafka
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema_registry
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
            SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_METHODS: 'GET,POST,PUT,OPTIONS'
            SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_ORIGIN: '*'
            SCHEMA_LOG4J_ROOT_LOGLEVEL: 'ERROR'
            SCHEMA_TOOLS_LOG4J_LOGLEVEL: 'ERROR'

    kafka_topics_ui:
        profiles: [ kafka-ui, kafka-all, all ]
        image: provectuslabs/kafka-ui:v0.7.2
        hostname: kafka-ui
        ports:
            - "${KAFKA_UI_PORT:-8080}:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
        networks:
            - kafka
        depends_on:
            - kafka

networks:
    postgres:
        driver: bridge
    kafka:
        driver: bridge

volumes:
    postgres-data:
    pgadmin-data:
